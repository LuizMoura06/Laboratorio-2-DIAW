name: Verificacao do projeto

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: React e TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  backend:
    name: Spring Boot e testes
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: alugamais
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d alugamais"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: mvn -B test
        working-directory: backend
      - name: Integracao da API com PostgreSQL
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/alugamais
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
        run: |
          set -euo pipefail
          mvn -q spring-boot:run > /tmp/alugamais-api.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 50); do
            if curl -fsS http://localhost:8080/api/health >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != "true" ]; then
            tail -n 100 /tmp/alugamais-api.log
            exit 1
          fi
          base=http://localhost:8080/api
          client=$(curl -fsS -H 'Content-Type: application/json' -d '{"username":"teste.cliente","password":"Teste123456","role":"CLIENT","fullName":"Cliente de Teste","cpf":"12345678901","rg":"MG123456","address":"Rua Exemplo, 100","profession":"Estudante"}' "$base/auth/register")
          echo "$client" | jq -e '.role == "CLIENT" and (.token | length == 64)' >/dev/null
          client_token=$(echo "$client" | jq -r .token)
          login=$(curl -fsS -H 'Content-Type: application/json' -d '{"username":"teste.cliente","password":"Teste123456"}' "$base/auth/login")
          echo "$login" | jq -e '.role == "CLIENT"' >/dev/null
          vehicles=$(curl -fsS -H "Authorization: Bearer $client_token" "$base/vehicles")
          echo "$vehicles" | jq -e 'length == 6' >/dev/null
          vehicle_id=$(echo "$vehicles" | jq -r '.[0].id')
          start_date=$(date -u -d '+2 days' +%F)
          end_date=$(date -u -d '+4 days' +%F)
          rental=$(curl -fsS -H "Authorization: Bearer $client_token" -H 'Content-Type: application/json' -d "{\"vehicleId\":\"$vehicle_id\",\"startDate\":\"$start_date\",\"endDate\":\"$end_date\",\"notes\":\"Reserva de teste\"}" "$base/rentals")
          echo "$rental" | jq -e '.status == "PENDING"' >/dev/null
          rental_id=$(echo "$rental" | jq -r .id)
          agent=$(curl -fsS -H 'Content-Type: application/json' -d '{"username":"teste.agente","password":"Teste123456","role":"AGENT","agentName":"Empresa de Teste","agentType":"COMPANY","cnpj":"12345678000199"}' "$base/auth/register")
          echo "$agent" | jq -e '.role == "AGENT"' >/dev/null
          agent_token=$(echo "$agent" | jq -r .token)
          reviewed=$(curl -fsS -X PATCH -H "Authorization: Bearer $agent_token" -H 'Content-Type: application/json' -d '{"status":"APPROVED","reviewNotes":"Renda aprovada na analise financeira."}' "$base/rentals/$rental_id/review")
          echo "$reviewed" | jq -e '.status == "APPROVED"' >/dev/null
          contracted=$(curl -fsS -H "Authorization: Bearer $agent_token" -H 'Content-Type: application/json' -d '{"credit":false}' "$base/rentals/$rental_id/contract")
          echo "$contracted" | jq -e '.status == "CONTRACTED"' >/dev/null
          curl -fsS -H "Authorization: Bearer $client_token" "$base/rentals/contracts" | jq -e 'length == 1' >/dev/null
